name: Probe aria2c module
on:
  push:
    branches: [probe-aria2c]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          base=https://repo1.maven.org/maven2/io/github/junkfood02/youtubedl-android
          curl -sSfLo a.aar $base/aria2c/0.18.1/aria2c-0.18.1.aar
          curl -sSfLo l.aar $base/library/0.18.1/library-0.18.1.aar
          unzip -l a.aar
          mkdir a l && (cd a && unzip -q ../a.aar) && (cd l && unzip -q ../l.aar)
          (cd a && unzip -l classes.jar)
          (cd a && unzip -q classes.jar -d cls && for c in $(find cls -name '*.class'); do javap -p -constants "$c"; done)
          (cd l && unzip -q classes.jar -d cls && javap -p -constants $(find cls -name 'YoutubeDL.class') | head -80)
          (cd l && for c in $(find cls -name 'YoutubeDL*.class' -o -name 'Constants*.class'); do echo "== $c"; strings "$c" | grep -i -E 'packages|usr/lib|LD_LIBRARY|aria2|SSL_CERT|python|ffmpeg' ; done)
          (cd a && for c in $(find cls -name '*.class'); do echo "== $c"; strings "$c" | grep -i -E 'packages|usr|zip|aria2|lib' ; done)
          (cd a && find jni -type f | xargs ls -la)
          mkdir z && cd z && unzip -q ../a/jni/arm64-v8a/libaria2c.zip.so && find . | head -40
