name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Logic tests
        run: bash tests/run_all.sh

  apk:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain
      # One download per processor. Most phones: arm64-v8a. Older phones and many TV boxes: armeabi-v7a.
      - uses: actions/upload-artifact@v4
        with:
          name: SatLinkBrowser-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SatLinkBrowser-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SatLinkBrowser-x86_64
          path: app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SatLinkBrowser-x86
          path: app/build/outputs/apk/debug/*-x86-*.apk
          if-no-files-found: error
