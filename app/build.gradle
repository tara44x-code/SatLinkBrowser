plugins {
    id 'com.android.application'
}

android {
    namespace 'com.satlink.geckoviewtest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.satlink.geckoviewtest'
        minSdk 26
        targetSdk 36
        versionCode 201
        versionName 'PRO 1.10.0'
    }

    // One APK per processor type instead of one APK carrying all four.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:150.0.20260511200624'

    // yt-dlp engine + FFmpeg for real format analysis, video/audio merging and MP3 conversion.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    // aria2c for torrent and magnet downloads.
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'
}
